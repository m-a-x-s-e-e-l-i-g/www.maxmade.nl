[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["!.lightroom-proof/**", "!.photography-cache/**", "!.env", "!.env.*"]

[build.environment]
  NODE_VERSION = "22"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  publish = "build"
  autoLaunch = false

[[plugins]]
package = "netlify-plugin-submit-sitemap"
  [plugins.inputs]
  ignorePeriod = 0 
