[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["!.lightroom-proof/**", "!.photography-cache/**", "!.env", "!.env.*"]

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.albums.maxmade.nl/*"
  to = "https://www.maxmade.nl/photography"
  status = 301
  force = true

[[redirects]]
  from = "http://www.albums.maxmade.nl/*"
  to = "https://www.maxmade.nl/photography"
  status = 301
  force = true

[[redirects]]
  from = "https://albums.maxmade.nl/parkour-1"
  to = "https://www.maxmade.nl/photography/parkour"
  status = 301
  force = true

[[redirects]]
  from = "http://albums.maxmade.nl/parkour-1"
  to = "https://www.maxmade.nl/photography/parkour"
  status = 301
  force = true

[[redirects]]
  from = "https://albums.maxmade.nl/favorites"
  to = "https://www.maxmade.nl/photography/favorites"
  status = 301
  force = true

[[redirects]]
  from = "http://albums.maxmade.nl/favorites"
  to = "https://www.maxmade.nl/photography/favorites"
  status = 301
  force = true

[[redirects]]
  from = "https://albums.maxmade.nl/*"
  to = "https://www.maxmade.nl/photography"
  status = 301
  force = true

[[redirects]]
  from = "http://albums.maxmade.nl/*"
  to = "https://www.maxmade.nl/photography"
  status = 301
  force = true

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  publish = "build"
  autoLaunch = false

[[plugins]]
package = "netlify-plugin-submit-sitemap"
  [plugins.inputs]
  ignorePeriod = 0 
